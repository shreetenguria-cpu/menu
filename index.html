<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b5a">

<style>
:root {
  --accent:#ff6b5a;
  --accent2:#facc15;
  --bg:#f3f4f6;
  --card:#ffffff;
  --muted:#777;
}

body {
  margin:0;
  font-family:"Poppins", system-ui;
  background:
    linear-gradient(rgba(255,255,255,0.88), rgba(255,255,255,0.88)),
    url("https://images.unsplash.com/photo-1543353071-873f17a7a088?auto=format&fit=crop&w=1200&q=60");
  background-size: cover;
  background-position: center;
  display:flex;
  justify-content:center;
}

#splash {
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#fff7ed,#ffe4e1);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.splash-card { text-align:center; animation:pop 0.5s ease; }
.splash-card img { width:90px; margin-bottom:12px; }
.splash-text {
  font-size:20px; font-weight:700;
  background:linear-gradient(135deg,#ff6b5a,#facc15);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.loader {
  margin:16px auto 0;
  width:40px; height:40px;
  border:4px solid #facc15;
  border-top:4px solid #ff6b5a;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pop { from { transform:scale(0.9); opacity:0 } to { transform:scale(1); opacity:1 } }

.app {
  background: rgba(243,244,246,0.95);
  width:100%;
  max-width:420px;
  min-height:100vh;
  border-radius:30px 30px 0 0;
  box-shadow:0 0 40px rgba(0,0,0,.25);
  overflow:hidden;
}

.header {
  background: linear-gradient(135deg,#fff,#fff7ed);
  padding:14px 18px 10px;
  text-align:center;
  border-bottom:1px solid #eee;
}
.header img { height:46px; margin-bottom:6px; }
.title {
  font-size:22px; font-weight:700;
  background:linear-gradient(135deg,#ff6b5a,#facc15);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle { font-size:13px; color:#a16207; }

.about {
  padding:18px; font-size:13px; color:#78350f;
  background:#fff7ed; margin:12px 18px; border-radius:16px;
}

.search { padding:10px 18px; background:var(--card); }
.search input {
  width:100%; padding:10px 14px;
  border-radius:12px; border:1px solid #ddd; font-size:14px;
}

.pills {
  display:flex; gap:10px; padding:12px 18px;
  overflow-x:auto; background:var(--card);
}
.pill {
  padding:6px 14px; background:#fef3c7;
  border-radius:999px; font-size:13px; color:#92400e; cursor:pointer;
}
.pill.active { background:var(--accent); color:white; }

.section {
  padding:14px 0 6px 18px; font-size:18px; font-weight:700; color:#7c2d12;
}

.item {
  display:flex; gap:12px; padding:12px 18px;
  background:var(--card); margin:8px 18px;
  border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,.06);
}

.item img {
  width:64px; height:64px; border-radius:12px; object-fit:cover;
  opacity:0; transition:opacity 0.4s ease;
  background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);
  background-size:400% 100%; animation:shimmer 1.4s infinite;
}
.item img.loaded { opacity:1; animation:none; }

@keyframes shimmer {
  0% { background-position:100% 0; }
  100% { background-position:-100% 0; }
}

.name { font-size:15px; font-weight:600; color:#1f2937; }
.desc { font-size:12px; color:#6b7280; }
.price { font-size:14px; font-weight:700; color:var(--accent); margin-top:4px; }
</style>
</head>

<body>

<div id="splash">
  <div class="splash-card">
    <img src="logo.png" onerror="this.src='https://via.placeholder.com/90x40?text=Logo'">
    <div class="splash-text">Shreeji Cafe & Restaurant</div>
    <div class="loader"></div>
  </div>
</div>

<div class="app">

  <div class="header">
    <img src="logo.png" onerror="this.src='https://via.placeholder.com/80x40?text=Logo'">
    <div class="title">Shreeji Cafe & Restaurant</div>
    <div class="subtitle">Every Bite Takes You Home</div>
  </div>

  <div class="about">
    🍽 <b>About Us:</b> A warm family restaurant serving fresh vegetarian Indian meals, hygienically prepared and served with love.
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="Search dishes..." oninput="doSearch()">
  </div>

  <div class="pills" id="pills"></div>
  <div id="menu"></div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";
let allItems = [];

fetch(API).then(r=>r.json()).then(d=>{
  allItems = d.items;
  init(allItems);
  document.getElementById("splash").style.display="none";
});

function init(items){
  const cats=[...new Set(items.map(i=>i.category))];
  const pills=document.getElementById("pills");
  pills.innerHTML="";
  cats.forEach((c,i)=>{
    const p=document.createElement("div");
    p.className="pill"+(i==0?" active":"");
    p.textContent=c;
    p.onclick=()=>filter(c,p);
    pills.appendChild(p);
  });
  render(items);
}

function render(list){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  let current="";
  list.forEach(i=>{
    if(i.category!==current){
      current=i.category;
      const s=document.createElement("div");
      s.className="section";
      s.textContent=current;
      menu.appendChild(s);
    }
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <img data-src="https://images.weserv.nl/?url=${encodeURIComponent(i.image)}&w=200&h=200&fit=cover" class="lazy">
      <div>
        <div class="name">${i.name}</div>
        <div class="desc">${i.desc||""}</div>
        <div class="price">₹${i.price}</div>
      </div>`;
    menu.appendChild(d);
  });
  initLazyLoading();
}

function filter(cat,p){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  render(allItems.filter(i=>i.category===cat));
}

function doSearch(){
  const q=document.getElementById("search").value.toLowerCase();
  render(allItems.filter(i=>i.name.toLowerCase().includes(q)));
}

function initLazyLoading(){
  const imgs=document.querySelectorAll("img.lazy");
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const img=e.target;
        img.src=img.dataset.src;
        img.onload=()=>img.classList.add("loaded");
        observer.unobserve(img);
      }
    });
  },{rootMargin:"200px"});
  imgs.forEach(img=>observer.observe(img));
}
</script>

</body>
</html>
