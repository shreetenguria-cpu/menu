<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>
<meta name="theme-color" content="#ff6b5a">

<style>
:root{--accent:#ff6b5a;}
body{margin:0;font-family:system-ui;background:#f3f4f6;display:flex;justify-content:center;}
.app{width:100%;max-width:440px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.15);}

.header{text-align:center;padding:12px;background:#fff7ed;}

/* BUTTON STATES */
.checkout {
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease;
}
.checkout:active { transform: scale(0.97); }

.checkout.loading{
  background:#999 !important;
  pointer-events:none;
}
.checkout.loading::after{
  content:"🍳 Sending...";
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.25);
}

.checkout.success{
  background:#16a34a !important;
}

/* CART POP */
@keyframes cartPop{
  0%{transform:scale(1)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
#cartBtn.pop{animation:cartPop .35s ease;}

/* TABLE STATUS (kept for logic but hidden) */
.table-grid{display:none;}

/* MENU */
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px;}
.pill{padding:6px 12px;background:#fef3c7;border-radius:999px;font-size:12px;cursor:pointer;}
.pill.active{background:var(--accent);color:white;}

.section{padding:10px 14px;font-weight:700;}

.item{
 display:flex;
 gap:10px;
 padding:10px 14px;
 margin:6px 10px;
 border-radius:16px;
 background:#fff;
 box-shadow:0 6px 14px rgba(0,0,0,.06);
}

.item img{
 width:64px;height:64px;border-radius:10px;object-fit:cover;
 background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
 background-size:400% 100%;
 animation:shimmer 1.2s infinite;
}
@keyframes shimmer{100%{background-position:-100%}}

.price{color:var(--accent);font-weight:700;}
.btn{padding:6px 10px;border-radius:10px;border:none;font-size:12px;}
.add{background:var(--accent);color:white;}

/* CART */
#cartBtn{
 position:fixed;bottom:20px;right:16px;
 background:var(--accent);color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:white;
 width:22px;height:22px;border-radius:50%;
 display:none;align-items:center;justify-content:center;font-size:12px;
}

/* KITCHEN BUTTON */
#kitchenBtn{
 position:fixed;bottom:90px;right:16px;
 background:#111;color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}

/* CART MODAL */
#cartModal{
 position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
}
#cartBox{
 width:90%;
 max-width:360px;
 background:white;
 border-radius:20px;
 padding:16px;
}

/* CONFETTI */
.confetti-piece{
 position:fixed;
 width:8px;height:8px;
 border-radius:50%;
 top:60%;
 animation:fall 2s linear forwards;
}
@keyframes fall{
 0%{transform:translateY(0) rotate(0deg);opacity:1;}
 100%{transform:translateY(-350px) rotate(360deg);opacity:0;}
}
</style>
</head>

<body>

<div class="app">
<div class="header">
  <img src="logo.png" style="height:60px;display:block;margin:0 auto 6px">
  <h3 style="margin:0">Shreeji Cafe & Restaurant</h3>
</div>

<div class="pills" id="pills"></div>
<div id="menu"></div>
</div>

<a href="kitchen.html" target="_blank" id="kitchenBtn">👨‍🍳</a>

<div id="cartBtn" onclick="openCart()">🛒<div id="badge">0</div></div>

<!-- SUCCESS LOADER -->
<div id="loader" style="
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.85);
 align-items:center;
 justify-content:center;
 flex-direction:column;
 z-index:999;
 text-align:center;
 color:white;
">

<div id="checkmark" style="
 width:90px;height:90px;border-radius:50%;
 border:4px solid #16a34a;
 display:flex;align-items:center;justify-content:center;
 font-size:50px;color:#16a34a;
 transform:scale(0);
 transition:transform .4s ease;
 margin-bottom:10px;">✔</div>

<img src="https://i.pinimg.com/originals/3f/2a/12/3f2a12ba15f5d2566553254b4a75f37c.gif"
 style="width:120px;border-radius:16px;margin-bottom:10px">

<div style="font-size:20px;font-weight:700">🍽️ Order Received!</div>
<div id="kotDisplay" style="font-size:16px;margin-top:6px;color:#ffd700">KOT: —</div>
</div>

<div id="cartModal" onclick="if(event.target===this)closeCart()">
 <div id="cartBox">
  <h3>Your Order</h3>
  <label>Table:</label>
  <select id="tableNo" style="width:100%;padding:8px;border-radius:10px;">
    <option value="">Select table</option>
  </select>

  <div id="cartList"></div>
  <div id="cartTotal" style="font-weight:700;margin-top:8px"></div>

  <button class="checkout" onclick="checkout()">Send to Kitchen</button>
 </div>
</div>

<audio id="voice"
 src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

<audio id="voiceText"
 src="https://actions.google.com/sounds/v1/voice/alert.ogg"></audio>

<script>
const BACKEND="https://script.google.com/macros/s/AKfycbwdnLe_6HRzuSmB72wMCkwPv3wiATPxxyQet_6RU2VFWus5iFm9MfO24O-9p0D_d3qX/exec";
const API="https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";
const BOT="8568547875:AAHK7SDOSKUMdnICtcPEvHRIz7WlnEXNFio";
const CHAT="-5139522761";

const isQR=new URLSearchParams(location.search).get("qr")==="1";
let items=[], cart={};

// fill tables
for(let i=1;i<=20;i++) tableNo.innerHTML+=`<option>${i}</option>`;

fetch(API).then(r=>r.json()).then(d=>{items=d.items;initMenu(items);});

/* MENU */
function initMenu(list){
 const cats=[...new Set(list.map(i=>i.category))];
 pills.innerHTML="";
 cats.forEach((c,i)=>{
  const p=document.createElement("div");
  p.className="pill"+(i===0?" active":"");
  p.textContent=c;
  p.onclick=()=>filter(c,p);
  pills.appendChild(p);
 });
 render(list);
}

function filter(cat,p){
 document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
 p.classList.add("active");
 render(items.filter(i=>i.category===cat));
}

function render(list){
 menu.innerHTML="";
 let cur="";
 list.forEach(i=>{
  if(i.category!==cur){cur=i.category;menu.innerHTML+=`<div class="section">${cur}</div>`;}
  const price=isQR?Math.round(i.price/2):i.price;
  const img=`https://images.weserv.nl/?url=${encodeURIComponent(i.image)}&w=200&h=200&fit=cover`;
  menu.innerHTML+=`
   <div class="item">
    <img data-src="${img}" class="lazy">
    <div style="flex:1">
     <b>${i.name}</b>
     <div class="price">₹${price}${isQR?` <s>₹${i.price}</s>`:""}</div>
     <button class="btn add" onclick="addToCart('${i.name}',${price})">Add</button>
    </div>
   </div>`;
 });
 initLazy();
}

/* CART */
function addToCart(n,p){
 cart[n]=cart[n]||{qty:0,price:p};
 cart[n].qty++;
 cartBtn.classList.add("pop");
 setTimeout(()=>cartBtn.classList.remove("pop"),350);
 updateBadge();
}

function updateBadge(){
 const c=Object.values(cart).reduce((a,b)=>a+b.qty,0);
 if(c){badge.style.display="flex";badge.innerText=c;}
 else badge.style.display="none";
}

function openCart(){
 cartList.innerHTML="";let t=0;
 for(let k in cart){
  let r=cart[k].qty*cart[k].price;
  t+=r;
  cartList.innerHTML+=`<div>${k} × ${cart[k].qty} — ₹${r}</div>`;
 }
 cartTotal.innerText="Total ₹"+t;
 cartModal.style.display="flex";
}

function closeCart(){cartModal.style.display="none";}

/* CONFETTI */
function launchConfetti(){
 for(let i=0;i<60;i++){
  const c=document.createElement("div");
  c.className="confetti-piece";
  c.style.left=Math.random()*100+"vw";
  c.style.background=["#ff6b5a","#16a34a","#ffd700","#3b82f6"][Math.floor(Math.random()*4)];
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),2000);
 }
}

/* CHECKOUT */
async function checkout(){
 const btn=document.querySelector(".checkout");
 loader.style.display="flex";
 btn.classList.add("loading");

 const table=tableNo.value;
 if(!table){alert("Select table");loader.style.display="none";btn.classList.remove("loading");return;}
 if(!Object.keys(cart).length){alert("Cart empty");loader.style.display="none";btn.classList.remove("loading");return;}

 let lines="",sub=0;
 for(let k in cart){let r=cart[k].qty*cart[k].price;sub+=r;lines+=`• ${k} x${cart[k].qty} = ₹${r}\n`;}
 const tax=Math.round(sub*0.05),srv=Math.round(sub*0.03),total=sub+tax+srv;

 const text=`🧾 NEW KOT\nTable:${table}\n\n${lines}\nSubtotal ₹${sub}\nTax ₹${tax}\nService ₹${srv}\nTOTAL ₹${total}`;

 const res=await fetch(BACKEND,{
  method:"POST",
  headers:{"Content-Type":"text/plain"},
  body:JSON.stringify({table,waiter:"N/A",order:cart,subtotal:sub,tax,service:srv,total,via:isQR?"QR":"Normal",text})
 }).then(r=>r.json());

 // Success effects
 kotDisplay.innerText="KOT: "+res.kot;
 voice.play(); voiceText.play();
 setTimeout(()=>checkmark.style.transform="scale(1)",300);
 setTimeout(launchConfetti,500);

 await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({chat_id:CHAT,text:text+"\n"+res.kot})
 });

 btn.classList.remove("loading");
 btn.classList.add("success");
 btn.innerText="✅ Order Sent";

 setTimeout(()=>{
  btn.classList.remove("success");
  btn.innerText="Send to Kitchen";
  loader.style.display="none";
  checkmark.style.transform="scale(0)";
 },2500);

 cart={}; updateBadge(); closeCart();
}

/* LAZY */
function initLazy(){
 const o=new IntersectionObserver(e=>e.forEach(x=>{
  if(x.isIntersecting){x.target.src=x.target.dataset.src;o.unobserve(x.target);}
 }),{rootMargin:"300px"});
 document.querySelectorAll("img.lazy").forEach(i=>o.observe(i));
}
</script>
</body>
</html>
