<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b5a">

<style>
:root {
  --accent:#ff6b5a;
  --accent2:#facc15;
  --bg:#f3f4f6;
  --card:#ffffff;
  --muted:#777;
}

body {
  margin:0;
  font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont;
  background: linear-gradient(135deg, #ffe4e1, #fff7ed);
  display:flex;
  justify-content:center;
}

.app {
  background:var(--bg);
  width:100%;
  max-width:420px;
  min-height:100vh;
  border-radius:30px 30px 0 0;
  box-shadow:0 0 40px rgba(0,0,0,.18);
  overflow:hidden;
}

.header {
  background: linear-gradient(135deg,#fff,#fff7ed);
  padding:14px 18px 10px;
  text-align:center;
  border-bottom:1px solid #eee;
}

.header img {
  height:46px;
  object-fit:contain;
  margin-bottom:6px;
}

.title {
  font-size:22px;
  font-weight:700;
  background:linear-gradient(135deg,#ff6b5a,#facc15);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle {
  font-size:13px;
  color:#a16207;
  margin-top:4px;
}

.search {
  padding:10px 18px;
  background:var(--card);
}

.search input {
  width:100%;
  padding:10px 14px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:14px;
}

.pills {
  display:flex;
  gap:10px;
  padding:12px 18px;
  overflow-x:auto;
  background:var(--card);
}

.pill {
  padding:6px 14px;
  background:#fef3c7;
  border-radius:999px;
  font-size:13px;
  color:#92400e;
  cursor:pointer;
}

.pill.active {
  background:var(--accent);
  color:white;
}

.section {
  padding:14px 0 6px 18px;
  font-size:18px;
  font-weight:700;
  color:#7c2d12;
}

.item {
  display:flex;
  gap:12px;
  padding:12px 18px;
  background:var(--card);
  margin:8px 18px;
  border-radius:16px;
  box-shadow:0 6px 16px rgba(0,0,0,.06);
}

.item img {
  width:64px;
  height:64px;
  border-radius:12px;
  object-fit:cover;
}

.name {
  font-size:15px;
  font-weight:600;
  color:#1f2937;
}

.desc {
  font-size:12px;
  color:#6b7280;
  margin-top:2px;
}

.price {
  font-size:14px;
  font-weight:700;
  color:var(--accent);
  margin-top:4px;
}

.about {
  padding:18px;
  font-size:13px;
  color:#78350f;
  background:#fff7ed;
  margin:12px 18px;
  border-radius:16px;
}
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <img src="https://cdn.jsdelivr.net/gh/twbs/icons@1.11.1/icons/egg-fried.svg" onerror="this.src='https://via.placeholder.com/80x40?text=Logo'">
    <div class="title">Shreeji Cafe & Restaurant</div>
    <div class="subtitle">Every Bite Takes You Home</div>
  </div>

  <div class="about">
    🍽 <b>About Us:</b> A warm family restaurant serving fresh vegetarian Indian meals, hygienically prepared and served with love.
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="Search dishes..." oninput="doSearch()">
  </div>

  <div class="pills" id="pills"></div>
  <div id="menu"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";
let allItems = [];

fetch(API).then(r=>r.json()).then(d=>{
  allItems = d.items;
  init(allItems);
});

function init(items){
  const cats=[...new Set(items.map(i=>i.category))];
  const pills=document.getElementById("pills");
  pills.innerHTML="";
  cats.forEach((c,i)=>{
    const p=document.createElement("div");
    p.className="pill"+(i==0?" active":"");
    p.textContent=c;
    p.onclick=()=>filter(c,p);
    pills.appendChild(p);
  });
  render(items);
}

function render(list){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  let current="";
  list.forEach(i=>{
    if(i.category!==current){
      current=i.category;
      const s=document.createElement("div");
      s.className="section";
      s.textContent=current;
      menu.appendChild(s);
      if(current.toLowerCase().includes("thali")){
        const d=document.createElement("div");
        d.className="desc";
        d.style.padding="0 18px 6px";
        d.textContent="Complete meal with dal, sabzi, roti, rice, salad and dessert.";
        menu.appendChild(d);
      }
    }
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <img src="${i.image}">
      <div>
        <div class="name">${i.name}</div>
        <div class="desc">${i.desc||""}</div>
        <div class="price">₹${i.price}</div>
      </div>`;
    menu.appendChild(d);
  });
}

function filter(cat,p){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  render(allItems.filter(i=>i.category===cat));
}

function doSearch(){
  const q=document.getElementById("search").value.toLowerCase();
  render(allItems.filter(i=>i.name.toLowerCase().includes(q)));
}
</script>

</body>
</html>
