<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>
<meta name="theme-color" content="#ff6b5a">

<style>
:root{--accent:#ff6b5a;}
body{margin:0;font-family:system-ui;background:#f3f4f6;display:flex;justify-content:center;}
.app{width:100%;max-width:440px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.15);}

.header{text-align:center;padding:12px;background:#fff7ed;}


 .checkout {
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease;
}

/* Click animation */
.checkout:active {
  transform: scale(0.97);
}

/* Loading state animation */
.checkout.loading {
  background: #999 !important;
  pointer-events: none;
}

.checkout.loading::after {
  content: "🍳 Sending...";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.2);
}

/* TABLE STATUS */
.table-grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
 padding:10px;
}
.table{
 padding:6px;border-radius:10px;text-align:center;font-size:12px;
 transition:background .6s,transform .3s;
 cursor:pointer;
}
.table.free{background:#dcfce7;animation:pulse .6s;}
.table.occupied{background:#fee2e2;}
@keyframes pulse{50%{transform:scale(1.05)}}

/* MENU */
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px;}
.pill{padding:6px 12px;background:#fef3c7;border-radius:999px;font-size:12px;cursor:pointer;}
.pill.active{background:var(--accent);color:white;}

.section{padding:10px 14px;font-weight:700;}

.item{
 display:flex;
 gap:10px;
 padding:10px 14px;
 margin:6px 10px;
 border-radius:16px;
 background:#fff;
 box-shadow:0 6px 14px rgba(0,0,0,.06);
}

.item img{
 width:64px;height:64px;border-radius:10px;object-fit:cover;
 background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
 background-size:400% 100%;
 animation:shimmer 1.2s infinite;
}
@keyframes shimmer{100%{background-position:-100%}}

.price{color:var(--accent);font-weight:700;}
.btn{padding:6px 10px;border-radius:10px;border:none;font-size:12px;}
.add{background:var(--accent);color:white;}
.remove{background:#e5e7eb;}

/* CART BUTTON + BADGE */
#cartBtn{
 position:fixed;bottom:20px;right:16px;
 background:var(--accent);color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:white;
 width:22px;height:22px;border-radius:50%;
 display:none;align-items:center;justify-content:center;font-size:12px;
}

/* KITCHEN BUTTON */
#kitchenBtn{
 position:fixed;bottom:90px;right:16px;
 background:#111;color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}

/* CART MODAL */
#cartModal{
 position:fixed;inset:0;
 background:rgba(0,0,0,.6);
 display:none;
 align-items:center;
 justify-content:center;
}
#cartBox{
 width:90%;
 max-width:360px;
 background:white;
 border-radius:20px;
 padding:16px;
}
.cartRow{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:6px 0;
}
.smallBtn{
 padding:4px 8px;
 border-radius:8px;
 border:none;
 background:#fee2e2;
 font-size:12px;
}
.checkout{
 width:100%;
 padding:10px;
 background:#25D366;
 color:white;
 border:none;
 border-radius:12px;
 margin-top:8px;
}
</style>
</head>

<body>

<div class="app">
<div class="header">
  <img src="logo.png" style="height:60px;display:block;margin:0 auto 6px">
  <h3 style="margin:0">Shreeji Cafe & Restaurant</h3>
</div>


<!-- TABLE STATUS (tap = preselect) -->
<!-- TABLE STATUS (hidden from header, still used in cart) -->
<div class="table-grid" id="tableStatus" style="display:none"></div>


<div class="pills" id="pills"></div>
<div id="menu"></div>
</div>

<a href="kitchen.html" target="_blank" id="kitchenBtn">👨‍🍳</a>

<div id="cartBtn" onclick="openCart()">🛒<div id="badge">0</div></div>
<div id="loader" style="
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.6);
 align-items:center;
 justify-content:center;
 z-index:999;
">
  <img src="https://i.pinimg.com/originals/3f/2a/12/3f2a12ba15f5d2566553254b4a75f37c.gif"
       style="width:120px;border-radius:16px">
</div>

<div id="cartModal" onclick="if(event.target===this)closeCart()">
 <div id="cartBox">
  <h3>Your Order</h3>

  <!-- TABLE SELECTION MOVED HERE -->
  <label>Table:</label>
  <select id="tableNo" style="width:100%;padding:8px;border-radius:10px;">
    <option value="">Select table</option>
  </select>

  <div id="cartList"></div>
  <div id="cartTotal" style="font-weight:700;margin-top:8px"></div>

  <button class="checkout" onclick="checkout()">Send to Kitchen</button>
 </div>
</div>

<audio id="voice"
 src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>


<script>
const BACKEND =
"https://script.google.com/macros/s/AKfycbwdnLe_6HRzuSmB72wMCkwPv3wiATPxxyQet_6RU2VFWus5iFm9MfO24O-9p0D_d3qX/exec";

const API =
"https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";

const BOT = "8568547875:AAHK7SDOSKUMdnICtcPEvHRIz7WlnEXNFio";
const CHAT = "-5139522761";

const isQR = new URLSearchParams(location.search).get("qr")==="1";

let items = [];
let cart = {};

// fill table dropdown
for(let i=1;i<=20;i++){
 tableNo.innerHTML += `<option value="${i}">${i}</option>`;
}

// load menu + tables
fetch(API).then(r=>r.json()).then(d=>{
 items = d.items;
 initMenu(items);
 loadTables();
});

/* ---------- TABLE STATUS ---------- */
function loadTables(){
 fetch(BACKEND+"?tables=1")
 .then(r=>r.json())
 .then(d=>{
  tableStatus.innerHTML="";
  d.forEach(t=>{
    const cls = t.status==="Free" ? "free" : "occupied";
    tableStatus.innerHTML += `
     <div class="table ${cls}"
          onclick="tableNo.value='${t.table}'">
        T${t.table}
     </div>`;
  });
 });
}

/* ---------- MENU ---------- */
function initMenu(list){
 const cats = [...new Set(list.map(i=>i.category))];
 pills.innerHTML="";

 cats.forEach((c,i)=>{
  const p=document.createElement("div");
  p.className="pill"+(i===0?" active":"");
  p.textContent=c;
  p.onclick=()=>filter(c,p);
  pills.appendChild(p);
 });

 render(list);
}

function filter(cat,p){
 document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
 p.classList.add("active");
 render(items.filter(i=>i.category===cat));
}

function render(list){
 menu.innerHTML="";
 let current="";

 list.forEach(i=>{
  if(i.category!==current){
   current=i.category;
   menu.innerHTML += `<div class="section">${current}</div>`;
  }

  const price = isQR ? Math.round(i.price/2) : i.price;
  const img = `https://images.weserv.nl/?url=${encodeURIComponent(i.image)}&w=200&h=200&fit=cover`;

  menu.innerHTML += `
   <div class="item">
     <img data-src="${img}" class="lazy">
     <div style="flex:1">
       <b>${i.name}</b>
       <div class="price">₹${price}
         ${isQR?` <s style="color:#999;font-size:12px">₹${i.price}</s>`:""}
       </div>
       <button class="btn add" onclick="addToCart('${i.name}',${price})">Add</button>
     </div>
   </div>`;
 });

 initLazy();
}

/* ---------- CART LOGIC (FIXED) ---------- */
function addToCart(name,price){
 cart[name] = cart[name] || {qty:0,price};
 cart[name].qty++;
 updateBadge();
}

function removeFromCart(name){
 delete cart[name];
 updateBadge();
 openCart(); // refresh cart UI
}

function updateBadge(){
 const count = Object.values(cart).reduce((a,b)=>a+b.qty,0);
 if(count>0){
   badge.style.display="flex";
   badge.innerText = count;
 } else {
   badge.style.display="none";
 }
}

/* ---------- CART MODAL ---------- */
function openCart(){
 cartList.innerHTML="";
 let total=0;

 for(let k in cart){
  const row = cart[k].qty * cart[k].price;
  total += row;

  cartList.innerHTML += `
   <div class="cartRow">
     <span>${k} × ${cart[k].qty} — ₹${row}</span>
     <button class="smallBtn" onclick="removeFromCart('${k}')">Remove</button>
   </div>`;
 }

 cartTotal.innerText = "Total: ₹"+total;
 cartModal.style.display="flex";
}

function closeCart(){
 cartModal.style.display="none";
}

/* ---------- CHECKOUT (FIXED) ---------- */
async function checkout(){
 document.getElementById("loader").style.display = "flex";
 const btn = document.querySelector(".checkout");
btn.classList.add("loading");
 const table = tableNo.value;

 if(!table){ alert("Select table"); return; }
 if(!Object.keys(cart).length){ alert("Cart empty"); return; }

 let lines="", subtotal=0;
 for(let k in cart){
   const r = cart[k].qty * cart[k].price;
   subtotal += r;
   lines += `• ${k} × ${cart[k].qty} = ₹${r}\n`;
 }

 const tax = Math.round(subtotal*0.05);
 const service = Math.round(subtotal*0.03);
 const total = subtotal + tax + service;

 const text =
`🧾 NEW KOT
Table: ${table}

${lines}
Subtotal: ₹${subtotal}
Tax: ₹${tax}
Service: ₹${service}
TOTAL: ₹${total}`;

 // ---- SEND TO APPS SCRIPT (BACKEND) ----
 const res = await fetch(BACKEND,{
   method:"POST",
   headers: {"Content-Type":"text/plain"},
   body:JSON.stringify({
     table,
     waiter:"N/A",
     order:cart,
     subtotal,tax,service,total,
     via:isQR?"QR":"Normal",
     text
   })
 }).then(r=>r.json());

 // ---- SEND TO TELEGRAM ----
 await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
     chat_id:CHAT,
     text:`${text}\n\n${res.kot}`
   })
 });

 voice.play();
 alert("Order sent to kitchen");
 cart={};
 updateBadge();
 closeCart();
 loadTables();

 btn.classList.remove("loading");
document.getElementById("loader").style.display = "none";

}

/* ---------- LAZY IMAGES ---------- */
function initLazy(){
 const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
   if(e.isIntersecting){
    e.target.src = e.target.dataset.src;
    obs.unobserve(e.target);
   }
  });
 },{rootMargin:"300px"});

 document.querySelectorAll("img.lazy").forEach(img=>obs.observe(img));
}
</script>
</body>
</html>
