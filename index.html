<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Cafe Menu</title>
<style>
body { margin:0; font-family:system-ui; background:#f6f6f6; }
.header { padding:16px; background:white; font-weight:700; font-size:20px; }
.item { display:flex; gap:12px; padding:12px; background:white; margin:10px; border-radius:14px; }
.item img { width:72px; height:72px; border-radius:12px; object-fit:cover; }
.price { font-weight:700; color:#ff6b5a; }
</style>
</head>
<body>

<div class="header">Shreeji Cafe & Restaurant</div>
<div id="menu"></div>

<script>
fetch("https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec")
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById("menu");
    data.items.forEach(i => {
      el.innerHTML += `
        <div class="item">
          <img src="${i.image}">
          <div>
            <div>${i.name}</div>
            <div class="price">₹${i.price}</div>
          </div>
        </div>`;
    });
  });
</script>

</body>
</html>
