<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b5a">

<style>
:root{--accent:#ff6b5a;}
body{margin:0;font-family:system-ui;background:#f3f4f6;display:flex;justify-content:center;}
.app{width:100%;max-width:440px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.15);}
.header{text-align:center;padding:12px;background:#fff7ed;}
.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;}
.table{padding:6px;border-radius:10px;text-align:center;font-size:12px;}
.search{padding:10px;}
.search input{width:100%;padding:10px;border-radius:12px;border:1px solid #ddd;}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px;}
.pill{padding:6px 12px;background:#fef3c7;border-radius:999px;font-size:12px;}
.pill.active{background:var(--accent);color:white;}
.section{padding:10px 14px;font-weight:700;}
.item{display:flex;gap:10px;padding:10px 14px;margin:6px 10px;border-radius:16px;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.06);}
.price{color:var(--accent);font-weight:700;}
.btn{padding:6px 10px;border-radius:10px;border:none;font-size:12px;}
.add{background:var(--accent);color:white;}
.remove{background:#e5e7eb;}
#cartBtn{position:fixed;bottom:20px;right:16px;background:var(--accent);color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;}
#cartModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;}
#cartBox{width:90%;max-width:360px;background:white;border-radius:20px;padding:16px;}
.cartItem{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;}
.checkout{width:100%;padding:10px;background:#25D366;color:white;border:none;border-radius:12px;margin-top:8px;}
#printBill{width:100%;padding:8px;border-radius:10px;margin-top:6px;}
</style>
</head>

<body>
<div class="app">

<div class="header">
  <img src="logo.png" style="height:40px">
  <h3>Shreeji Cafe & Restaurant</h3>
</div>
<!-- ADD THIS AFTER HEADER -->
<div style="padding:10px;background:#fff7ed;margin:10px;border-radius:12px;">
  <label>Table:</label>
  <select id="tableNo" style="width:100%;padding:8px;border-radius:10px;">
    <option value="">Select table</option>
    <script>
      for(let i=1;i<=20;i++){
        document.write(`<option value="${i}">${i}</option>`);
      }
    </script>
  </select>

  <label style="display:block;margin-top:8px;">Waiter Name:</label>
  <input id="waiter" placeholder="Enter waiter"
         style="width:100%;padding:8px;border-radius:10px;">
</div>

<div class="table-grid" id="tableStatus"></div>

<div class="search">
  <input id="search" placeholder="Search dishes..." oninput="doSearch()">
</div>

<div class="pills" id="pills"></div>
<div id="menu"></div>
</div>

<div id="cartBtn" onclick="openCart()">🛒</div>

<div id="cartModal" onclick="if(event.target===this) closeCart()">
  <div id="cartBox">
    <h3>Your Order</h3>
    <div id="cartList"></div>
    <div id="cartTotal" style="font-weight:700"></div>
    <button class="checkout" onclick="checkout()">Send to Kitchen</button>
    <button id="printBill" onclick="printBill()">🖨 Print Bill</button>
  </div>
</div>

<audio id="voice" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7e13d8b4e8.mp3"></audio>

<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbwdnLe_6HRzuSmB72wMCkwPv3wiATPxxyQet_6RU2VFWus5iFm9MfO24O-9p0D_d3qX/exec";

const API = "https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";

const TELEGRAM_BOT = "8568547875:AAHK7SDOSKUMdnICtcPEvHRIz7WlnEXNFio";
const TELEGRAM_CHAT_ID = "-5139522761";

const isQR = new URLSearchParams(location.search).get("qr")==="1";
let allItems = [];
let cart = {};

fetch(API).then(r=>r.json()).then(d=>{
 allItems = d.items;
 init(allItems);
 loadTables();
});

function loadTables(){
 fetch(BACKEND+"?tables=1")
 .then(r=>r.json())
 .then(d=>{
   const box = document.getElementById("tableStatus");
   box.innerHTML="";
   d.forEach(t=>{
     const color = t.status==="Free" ? "#dcfce7" : "#fee2e2";
     box.innerHTML += `
      <div class="table" style="background:${color}">
        T${t.table}
      </div>`;
   });
 });
}

function init(items){
 const cats=[...new Set(items.map(i=>i.category))];
 const pills=document.getElementById("pills");
 pills.innerHTML="";
 cats.forEach((c,i)=>{
   const p=document.createElement("div");
   p.className="pill"+(i==0?" active":"");
   p.textContent=c;
   p.onclick=()=>filter(c,p);
   pills.appendChild(p);
 });
 render(items);
}

function render(list){
 const menu=document.getElementById("menu");
 menu.innerHTML="";
 let current="";

 list.forEach(i=>{
  if(i.category!==current){
    current=i.category;
    const s=document.createElement("div");
    s.className="section";
    s.textContent=current;
    menu.appendChild(s);
  }

  const price = isQR ? Math.round(i.price/2) : i.price;

  const d=document.createElement("div");
  d.className="item";
  d.innerHTML=`
   <img src="${i.image}" width="64">
   <div style="flex:1">
     <div><b>${i.name}</b></div>
     <div class="price">₹${price}</div>
     <button class="btn add" onclick="addToCart('${i.name}',${price})">Add</button>
     <button class="btn remove" onclick="removeFromCart('${i.name}')">Remove</button>
   </div>
  `;
  menu.appendChild(d);
 });
}

function addToCart(name,price){
 cart[name] = cart[name] ? {...cart[name], qty:cart[name].qty+1} : {qty:1,price};
 updateCartBtn();
}

function removeFromCart(name){
 if(cart[name]){
   cart[name].qty--;
   if(cart[name].qty<=0) delete cart[name];
 }
 updateCartBtn();
}

function updateCartBtn(){
 let count=Object.values(cart).reduce((a,b)=>a+b.qty,0);
 document.getElementById("cartBtn").innerText = count>0 ? "🛒 "+count : "🛒";
}

function openCart(){
 const box=document.getElementById("cartList");
 box.innerHTML="";
 let total=0;

 for(let item in cart){
   const rowTotal = cart[item].qty * cart[item].price;
   total += rowTotal;
   box.innerHTML += `<div class="cartItem">
      <span>${item} × ${cart[item].qty}</span>
      <span>₹${rowTotal}</span>
   </div>`;
 }
 document.getElementById("cartTotal").innerText = "Total: ₹"+total;
 document.getElementById("cartModal").style.display="flex";
}

function closeCart(){ document.getElementById("cartModal").style.display="none"; }

async function checkout(){
  const table = document.getElementById("tableNo").value;
  const waiter = document.getElementById("waiter").value || "N/A";

  if(!table){ alert("Select table first"); return; }
  if(Object.keys(cart).length===0){ alert("Cart empty"); return; }

  let lines=[], subtotal=0;

  for(let item in cart){
    const row = cart[item].qty * cart[item].price;
    subtotal += row;
    lines.push(`• ${item} × ${cart[item].qty} = ₹${row}`);
  }

  const tax = Math.round(subtotal * 0.05);      // 5% tax
  const service = Math.round(subtotal * 0.03);  // 3% service
  const total = subtotal + tax + service;

  const text = `🧾 NEW KOT\nTable: ${table}\nWaiter: ${waiter}\n\n`
               + lines.join("\n")
               + `\n\nSubtotal: ₹${subtotal}`
               + `\nTax (5%): ₹${tax}`
               + `\nService (3%): ₹${service}`
               + `\nTOTAL: ₹${total}`;

  // Send to backend (gets auto KOT + Bill number)
  const res = await fetch(BACKEND,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      table, waiter, order:cart,
      subtotal, tax, service, total,
      via:isQR?"QR":"Normal",
      text
    })
  }).then(r=>r.json());

  // Send to Telegram Kitchen
  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:TELEGRAM_CHAT_ID,
      text:`${text}\n\nKOT: ${res.kot}\nBILL: ${res.bill}`
    })
  });

  document.getElementById("voice").play();
  alert(`Order sent!\n${res.kot} | ${res.bill}`);

  cart={}; updateCartBtn(); closeCart(); loadTables();
}

 
function printBill(){
 let subtotal=0;

 for(let item in cart){
   subtotal += cart[item].qty * cart[item].price;
 }

 const tax = Math.round(subtotal*0.05);
 const service = Math.round(subtotal*0.03);
 const total = subtotal + tax + service;

 let bill = `
SHREEJI CAFE & RESTAURANT
-------------------------
Table: ${document.getElementById("tableNo").value}
Waiter: ${document.getElementById("waiter").value||"N/A"}
-------------------------
`;

 for(let item in cart){
   const row = cart[item].qty * cart[item].price;
   bill += `${item.padEnd(18)} ${cart[item].qty} x ₹${cart[item].price}\n`;
 }

 bill += `
-------------------------
Subtotal: ₹${subtotal}
Tax 5%   : ₹${tax}
Service 3%: ₹${service}
-------------------------
TOTAL    : ₹${total}
-------------------------
Thank you! Visit again.
`;

 const w = window.open();
 w.document.write(`<pre style="font-size:14px">${bill}</pre>`);
 w.print();
}
</script>
</body>
</html>
