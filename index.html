<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>
<meta name="theme-color" content="#ff6b5a">

<style>
:root{--accent:#ff6b5a;}
body{margin:0;font-family:system-ui;background:#f3f4f6;display:flex;justify-content:center;}
.app{width:100%;max-width:440px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.15);}

.header{text-align:center;padding:12px;background:#fff7ed;}

.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px;}
.table{
 padding:6px;border-radius:10px;text-align:center;font-size:12px;
 transition:background .6s,transform .3s;
 cursor:pointer;
}
.table.free{background:#dcfce7;animation:pulse .6s;}
.table.occupied{background:#fee2e2;}
@keyframes pulse{50%{transform:scale(1.05)}}

.form{padding:10px;background:#fff7ed;margin:10px;border-radius:12px;}
.form input,.form select{width:100%;padding:8px;border-radius:10px;border:1px solid #ddd;}

.pills{display:flex;gap:8px;overflow-x:auto;padding:10px;}
.pill{padding:6px 12px;background:#fef3c7;border-radius:999px;font-size:12px;cursor:pointer;}
.pill.active{background:var(--accent);color:white;}

.section{padding:10px 14px;font-weight:700;}
.item{display:flex;gap:10px;padding:10px 14px;margin:6px 10px;border-radius:16px;background:#fff;box-shadow:0 6px 14px rgba(0,0,0,.06);}

.item img{
 width:64px;height:64px;border-radius:10px;object-fit:cover;
 background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
 background-size:400% 100%;
 animation:shimmer 1.2s infinite;
}
@keyframes shimmer{100%{background-position:-100%}}

.price{color:var(--accent);font-weight:700;}
.btn{padding:6px 10px;border-radius:10px;border:none;font-size:12px;}
.add{background:var(--accent);color:white;}
.remove{background:#e5e7eb;}

#cartBtn{
 position:fixed;bottom:20px;right:16px;
 background:var(--accent);color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}
#badge{
 position:absolute;top:-6px;right:-6px;
 background:red;color:white;
 width:22px;height:22px;border-radius:50%;
 display:none;align-items:center;justify-content:center;font-size:12px;
}

#kitchenBtn{
 position:fixed;bottom:90px;right:16px;
 background:#111;color:white;
 width:60px;height:60px;border-radius:50%;
 display:flex;align-items:center;justify-content:center;font-size:22px;
}

#cartModal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;}
#cartBox{width:90%;max-width:360px;background:white;border-radius:20px;padding:16px;}
.cartItem{display:flex;justify-content:space-between;font-size:13px;margin:6px 0;}
.checkout{width:100%;padding:10px;background:#25D366;color:white;border:none;border-radius:12px;margin-top:8px;}
</style>
</head>

<body>

<div class="app">
<div class="header">
  <h3>Shreeji Cafe & Restaurant</h3>
</div>

<div class="table-grid" id="tableStatus"></div>

<div class="form">
  <label>Table</label>
  <select id="tableNo"><option value="">Select</option></select>
  <label style="margin-top:8px;display:block">Waiter</label>
  <input id="waiter" placeholder="Name">
</div>

<div class="pills" id="pills"></div>
<div id="menu"></div>
</div>

<a href="kitchen.html" target="_blank" id="kitchenBtn">👨‍🍳</a>

<div id="cartBtn" onclick="openCart()">🛒<div id="badge">0</div></div>

<div id="cartModal" onclick="if(event.target===this)cartModal.style.display='none'">
 <div id="cartBox">
  <h3>Your Order</h3>
  <div id="cartList"></div>
  <div id="cartTotal"></div>
  <button class="checkout" onclick="checkout()">Send to Kitchen</button>
 </div>
</div>

<audio id="voice" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7e13d8b4e8.mp3"></audio>

<script>
const BACKEND="https://script.google.com/macros/s/AKfycbwdnLe_6HRzuSmB72wMCkwPv3wiATPxxyQet_6RU2VFWus5iFm9MfO24O-9p0D_d3qX/exec";
const API="https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";
const BOT="8568547875:AAHK7SDOSKUMdnICtcPEvHRIz7WlnEXNFio";
const CHAT="-5139522761";

const isQR=new URLSearchParams(location.search).get("qr")==="1";
let items=[],cart={};

for(let i=1;i<=20;i++) tableNo.innerHTML+=`<option>${i}</option>`;

fetch(API).then(r=>r.json()).then(d=>{items=d.items;init(items);});
loadTables();

function loadTables(){
 fetch(BACKEND+"?tables=1").then(r=>r.json()).then(d=>{
  tableStatus.innerHTML="";
  d.forEach(t=>{
   tableStatus.innerHTML+=`
   <div class="table ${t.status.toLowerCase()}"
    onclick="tableNo.value='${t.table}'">T${t.table}</div>`;
  });
 });
}

function init(list){
 const cats=[...new Set(list.map(i=>i.category))];
 pills.innerHTML="";
 cats.forEach((c,i)=>{
  const p=document.createElement("div");
  p.className="pill"+(i==0?" active":"");
  p.textContent=c;
  p.onclick=()=>{document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));p.classList.add("active");render(list.filter(i=>i.category===c));};
  pills.appendChild(p);
 });
 render(list);
}

function render(list){
 menu.innerHTML="";
 let cur="";
 list.forEach(i=>{
  if(i.category!==cur){cur=i.category;menu.innerHTML+=`<div class="section">${cur}</div>`;}
  const price=isQR?Math.round(i.price/2):i.price;
  const img=`https://images.weserv.nl/?url=${encodeURIComponent(i.image)}&w=200&h=200&fit=cover`;
  menu.innerHTML+=`
  <div class="item">
   <img data-src="${img}" class="lazy">
   <div>
    <b>${i.name}</b>
    <div class="price">₹${price}${isQR?` <s>₹${i.price}</s>`:""}</div>
    <button class="btn add" onclick="add('${i.name}',${price})">Add</button>
   </div>
  </div>`;
 });
 lazy();
}

function add(n,p){cart[n]=(cart[n]||{qty:0,price:p});cart[n].qty++;badge();}
function badge(){
 const c=Object.values(cart).reduce((a,b)=>a+b.qty,0);
 badge.style.display=c?"flex":"none";badge.innerText=c;
}

function openCart(){
 cartList.innerHTML="";let t=0;
 for(let k in cart){let r=cart[k].qty*cart[k].price;t+=r;cartList.innerHTML+=`<div class="cartItem"><span>${k}×${cart[k].qty}</span><span>₹${r}</span></div>`;}
 cartTotal.innerText="Total ₹"+t;
 cartModal.style.display="flex";
}

async function checkout(){
 if(!tableNo.value||!waiter.value){alert("Table & waiter required");return;}
 if(!Object.keys(cart).length){alert("Cart empty");return;}

 let text="";let sub=0;
 for(let k in cart){let r=cart[k].qty*cart[k].price;sub+=r;text+=`• ${k} x${cart[k].qty} = ₹${r}\n`;}
 const tax=Math.round(sub*0.05),srv=Math.round(sub*0.03),total=sub+tax+srv;

 const msg=`🧾 NEW KOT\nTable:${tableNo.value}\nWaiter:${waiter.value}\n\n${text}\nSubtotal ₹${sub}\nTax ₹${tax}\nService ₹${srv}\nTOTAL ₹${total}`;

 const res=await fetch(BACKEND,{method:"POST",headers:{"Content-Type":"application/json"},
 body:JSON.stringify({table:tableNo.value,waiter:waiter.value,order:cart,subtotal:sub,tax,service:srv,total,via:isQR?"QR":"Normal",text:msg})}).then(r=>r.json());

 await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:CHAT,text:msg+"\n"+res.kot})});

 voice.play();alert("Order sent");
 cart={};badge();cartModal.style.display="none";loadTables();
}

function lazy(){
 const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.src=x.target.dataset.src;o.unobserve(x.target);}}),{rootMargin:"300px"});
 document.querySelectorAll("img.lazy").forEach(i=>o.observe(i));
}
</script>
</body>
</html>
