<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shreeji Menu</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b5a">

<style>
:root {
  --accent:#ff6b5a; --bg:#f3f4f6; --card:#fff; --muted:#888;
}
body { margin:0; font-family:system-ui; background:#e5e7eb; display:flex; justify-content:center; }
.app { background:var(--bg); width:100%; max-width:420px; min-height:100vh; border-radius:30px 30px 0 0; box-shadow:0 0 40px rgba(0,0,0,.15); overflow:hidden; }
.header { background:var(--card); padding:14px 18px 10px; text-align:center; border-bottom:1px solid #eee; }
.header img { height:48px; object-fit:contain; margin-bottom:4px; }
.title { font-size:20px; font-weight:700; }
.search { padding:10px 18px; background:var(--card); }
.search input { width:100%; padding:10px 14px; border-radius:12px; border:1px solid #ddd; font-size:14px; }
.pills { display:flex; gap:10px; padding:12px 18px; overflow-x:auto; background:var(--card); }
.pill { padding:6px 14px; background:#f1f1f1; border-radius:999px; font-size:13px; cursor:pointer; }
.pill.active { background:var(--accent); color:white; }
.section { padding:14px 0 6px 18px; font-size:18px; font-weight:600; }
.item { display:flex; gap:12px; padding:12px 18px; background:var(--card); margin:8px 18px; border-radius:16px; box-shadow:0 6px 16px rgba(0,0,0,.05); }
.item img { width:64px; height:64px; border-radius:12px; object-fit:cover; }
.item-body { flex:1; }
.name { font-size:15px; font-weight:600; }
.desc { font-size:12px; color:var(--muted); margin-top:2px; }
.price { font-size:14px; font-weight:700; color:var(--accent); margin-top:4px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <img src="logo.png">
    <div class="title">ShreeJi Cafe & Restaurant</div>
  </div>

  <div class="search">
    <input type="text" id="search" placeholder="Search dishes..." oninput="doSearch()">
  </div>

  <div class="pills" id="pills"></div>
  <div id="menu"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzxBSxMEch_tdDUbTEEtzngBQWHRI83Ce8HELgA-GDjCG63drp0tSaDAAODACeFpwk4/exec";
let allItems = [];

fetch(API).then(r=>r.json()).then(d=>{
  allItems = d.items;
  init(allItems);
});

function init(items){
  const cats=[...new Set(items.map(i=>i.category))];
  const pills=document.getElementById("pills");
  pills.innerHTML="";
  cats.forEach((c,i)=>{
    const p=document.createElement("div");
    p.className="pill"+(i==0?" active":"");
    p.textContent=c;
    p.onclick=()=>filter(c,p);
    pills.appendChild(p);
  });
  render(items);
}

function render(list){
  const menu=document.getElementById("menu");
  menu.innerHTML="";
  let current="";
  list.forEach(i=>{
    if(i.category!==current){
      current=i.category;
      const s=document.createElement("div");
      s.className="section";
      s.textContent=current;
      menu.appendChild(s);
    }
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`
      <img src="${i.image}">
      <div class="item-body">
        <div class="name">${i.name}</div>
        <div class="desc">${i.desc||""}</div>
        <div class="price">₹${i.price}</div>
      </div>`;
    menu.appendChild(d);
  });
}

function filter(cat,p){
  document.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
  p.classList.add("active");
  render(allItems.filter(i=>i.category===cat));
}

function doSearch(){
  const q=document.getElementById("search").value.toLowerCase();
  render(allItems.filter(i=>i.name.toLowerCase().includes(q)));
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
