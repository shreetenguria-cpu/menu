<!DOCTYPE html>
<html>
<head>
<title>Kitchen Dashboard</title>
<style>
body{margin:0;font-family:system-ui;background:#111;color:white;}
#board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;}
.card{background:#222;padding:12px;border-radius:12px;}
.done{background:#16a34a;color:white;border:none;padding:6px 10px;border-radius:8px;}
</style>
</head>
<body>

<h2 style="text-align:center">Kitchen KOT</h2>
<div id="board"></div>

<script>
const BACKEND="https://script.google.com/macros/s/AKfycbwdnLe_6HRzuSmB72wMCkwPv3wiATPxxyQet_6RU2VFWus5iFm9MfO24O-9p0D_d3qX/exec";
let timers={};

function load(){
 fetch(BACKEND+"?kot=1").then(r=>r.json()).then(d=>{
  board.innerHTML="";
  d.forEach(k=>{
   if(!timers[k.kot]) timers[k.kot]=Date.now();
   const m=Math.floor((Date.now()-timers[k.kot])/60000);
   const s=Math.floor(((Date.now()-timers[k.kot])%60000)/1000);
   board.innerHTML+=`
   <div class="card">
    <h3>${k.kot}</h3>
    <b>Table ${k.table}</b>
    <pre>${k.text}</pre>
    <b style="color:${m>=12?'orange':'white'}">⏱ ${m}m ${s}s</b><br><br>
    <button class="done" onclick="complete('${k.kot}')">Completed</button>
   </div>`;
  });
 });
}

function complete(k){
 fetch(BACKEND+"?complete="+k);
 delete timers[k];
}

setInterval(load,5000);load();
</script>
</body>
</html>
